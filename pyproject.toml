[project]
name = "train-persian-tokenizer"
version = "0.1.0"
description = "train a tokenizer for Persian language."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.2.0",
    "huggingface-hub>=2.4.0",
    "pyyaml>=6.0.4",
    "tokenizers>=0.23.3",
    "tqdm>=4.70.1",
    "transformers>=5.24.0",
]


[[tool.uv.index]]
name = "aliyan"
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
